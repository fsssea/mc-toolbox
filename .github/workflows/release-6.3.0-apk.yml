name: Release 6.3.0 maker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-6.3.0-apk.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        run: |
          set -e
          curl -L --retry 3 --fail -o MC-Toolbox-6.3.0.apk "https://aka.doubaocdn.com/s/FYHDtmRTjy"
          ls -lh MC-Toolbox-6.3.0.apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create v6.3.0 \
            --title "MC工具箱 6.3.0 附加包制作器重置版" \
            --notes "重做附加包制作器：方块 / 物品 / 生物 / 脚本四类内容按需生成，自动写行为包与资源包的 manifest、贴图清单、语言文件；生物包含行为、客户端实体和 spawn egg，不再是一张贴图的空壳。UUID 与贴图全部本地生成，不联网。生成前会校验包名、命名空间、ID、堆叠、生命值、颜色，错误直接拦住。同步修复文件树跨根目录只显示第一层的问题，并合并重复的制作器入口。安卓版 versionCode 73，签名与 6.2.1 相同，可直接覆盖升级。" \
            MC-Toolbox-6.3.0.apk \
          || gh release upload v6.3.0 MC-Toolbox-6.3.0.apk --clobber
